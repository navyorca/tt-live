<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>암호 입력</title>
<style>
:root{--paper:#FFFFFF;--card:#FFFFFF;--ink:#111111;--sub:#666666;--line:#DFE3EC;--brand:#246CB9;--err:#C62828}
@media (prefers-color-scheme:dark){:root{--paper:#0A1128;--card:#111B3A;--ink:#EFF3FC;--sub:#C9D3E8;--line:#39456E;--brand:#9CC4FF;--err:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--paper);color:var(--ink);font:19px/1.5 "Malgun Gothic",-apple-system,sans-serif}
form{width:100%;max-width:320px;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:12px}
h1{margin:0 0 16px;font-size:22px}
input,button{display:block;width:100%;min-height:48px;font:inherit;border-radius:8px}
input{padding:0 12px;border:1px solid var(--line);background:transparent;color:inherit;letter-spacing:.2em}
button{margin-top:12px;border:0;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
p{min-height:24px;margin:12px 0 0;color:var(--err);font-size:16px}
form[hidden]{display:none}
</style>
</head>
<body>
<form id="f" hidden>
<h1>암호를 입력해 주세요</h1>
<input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="암호" autofocus>
<button id="go" type="submit">열기</button>
<p id="msg" role="alert"></p>
</form>
<script>
(() => {
  const SALT = "2eb3fa35c17ad678c1940ea42c7750b3", ITER = 310000, PAGE = "quote.enc", DATA = "classes.enc", STORE = "tt_lock_ec6096d9";
  const TAG = '<script src="kegone_classes_latest.js"><\/script>';
  const bytes = h => Uint8Array.from(h.match(/../g), x => parseInt(x, 16));
  const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  const load = () => { try { return localStorage.getItem(STORE); } catch (e) { return null; } };
  const keep = v => { try { v ? localStorage.setItem(STORE, v) : localStorage.removeItem(STORE); } catch (e) {} };
  const $ = id => document.getElementById(id);

  async function derive(pw) {
    const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return hex(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bytes(SALT), iterations: ITER }, k, 256));
  }
  async function get(name) {
    const r = await fetch(name, { cache: "no-cache" });
    if (!r.ok) throw new Error("fetch");
    return new Uint8Array(await r.arrayBuffer());
  }
  async function unlock(keyHex) {
    const [page, data] = await Promise.all([get(PAGE), get(DATA)]);
    const key = await crypto.subtle.importKey("raw", bytes(keyHex), "AES-GCM", false, ["decrypt"]);
    const open = async b => new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, key, b.slice(12)));
    const [html, js] = await Promise.all([open(page), open(data)]);
    keep(keyHex);
    document.open();
    document.write(html.replace(TAG, () => "<script>" + js + "<\/script>"));
    document.close();
  }
  function fail(e) {
    const f = $("f"), wrong = e && e.name === "OperationError";
    if (wrong) keep(null);
    f.hidden = false; $("go").disabled = false;
    $("msg").textContent = wrong ? "암호가 맞지 않습니다." : "파일을 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.";
    $("pw").value = ""; $("pw").focus();
  }
  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    if (!$("pw").value) return;
    $("go").disabled = true; $("msg").textContent = "";
    try { await unlock(await derive($("pw").value)); } catch (x) { fail(x); }
  });
  const saved = load();
  if (saved) unlock(saved).catch(e => { fail(e); if (e && e.name === "OperationError") $("msg").textContent = ""; });
  else $("f").hidden = false;
})();
</script>
</body>
</html>
